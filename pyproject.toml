[project]
name = "ecom-customer-agent"
version = "0.1.0"
description = "电商客服 Agent 系统（淘宝 / 拼多多 / 抖店）"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "chromadb>=0.5.5",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "apps*",
    "runtime*",
    "tool_center*",
    "knowledge_platform*",
    "mcp_services*",
    "security*",
    "common*",
    "platform_infra*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
